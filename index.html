<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HERE · 목민교회 고등부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HERE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 디자인 토큰: Modern Minimal (딥 네이비 + 로열 블루, 색은 꼭 필요한 곳에만) ===== */
:root{
  --fs:17px;
  --ci-blue:#1475bc; --ci-sky:#00b9f2; --ci-orange:#f7941d; --ci-lime:#b2d235;   /* 교회 CI (로고 · 워드마크에만) */
  --p-blue:#eef4fc; --p-sky:#edf5fa; --p-peach:#fdf4e6; --p-lime:#e9f5ee; --p-lilac:#f1f1fa; --p-rose:#fcf0f2;
  --bg:#f7f8fa; --card:#ffffff; --ink:#172033; --sub:#7a8495; --line:#e9edf2;
  --pri:#2675c9; --pri-soft:#eaf2fb; --navy:#142b50;
  --ok:#27945b; --ok-strong:#27945b; --ok-soft:#e8f4ee;
  --no:#d9475f; --no-soft:#fcf0f2;
  --warn:#a86a12; --warn-c:#e9a23b; --warn-soft:#fdf3e3;
  --r:20px; --r-sm:12px; --r-btn:14px;
  --shadow:0 1px 2px rgba(20,43,80,.035),0 4px 14px rgba(20,43,80,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45;word-break:keep-all;letter-spacing:-.01em;
  background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:var(--ink);width:100%;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
textarea{min-height:7rem;resize:vertical}
label{display:block;font-weight:700;margin:.85rem 0 .3rem;font-size:.86rem;color:var(--sub)}
a{color:var(--pri)}
svg.ic{width:1.25em;height:1.25em;flex:none;display:block}

#app{max-width:640px;margin:0 auto;padding:0 16px 120px}

/* ----- 도구줄 (글씨 크기 · PC 보기) ----- */
.tools{display:flex;gap:6px;padding:10px 0 2px}
.tools .seg{flex:1;display:flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.tools .seg button{flex:1;height:2.3rem;border-radius:999px;font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:.35rem;color:var(--ink)}
.tools .seg button:active{background:var(--p-blue)}
.tools .seg i{width:1px;background:var(--line);margin:6px 0}
.tools .a1{font-size:.78em;opacity:.7} .tools .a2{font-size:1.2em}
.tools .pcbtn{flex:none;padding:0 1rem;border-radius:999px;background:var(--navy);color:#fff;font-weight:800;font-size:.86rem}
@media (max-width:699px){.tools .pcbtn{display:none}}

/* ----- 글씨 크기 3단계 (px 고정: 글씨를 키워도 버튼 크기는 그대로) ----- */
.fsseg{flex:none;display:inline-flex;align-items:center;gap:1px;height:34px;padding:2px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:var(--shadow)}
.fsseg button{width:30px;height:28px;min-height:0;padding:0;border:0;border-radius:999px;background:none;display:flex;align-items:center;justify-content:center;color:var(--sub);font-weight:800;line-height:1}
.fsseg button.on{background:var(--navy);color:#fff}
.fsseg .f0{font-size:12px}.fsseg .f1{font-size:15px}.fsseg .f2{font-size:19px}
.tools{align-items:center;justify-content:flex-end}.tools .fs-lb{font-size:13px;font-weight:700;color:var(--sub);margin-right:2px}.tools .pcbtn{height:34px}
.hd .fsseg{margin-left:auto}.hd .fsseg+.yearchip{margin-left:0}
/* 맨 위 줄은 글씨 크기와 상관없이 같은 크기 (로고 자리 지키기) */
.hd .yearchip{font-size:14px!important;min-height:34px!important;padding:0 10px!important}
.hd .icon-btn{width:36px!important;height:36px!important}.hd .icon-btn svg{width:21px!important;height:21px!important}
.hd .icon-btn .dot{top:7px;right:7px;width:8px;height:8px}
.hd .logo img{height:34px!important}
@media (max-width:380px){.fsseg{height:32px}.fsseg button{width:27px;height:26px}.hd .logo img{height:1.8rem}}
/* ----- 상단 바 ----- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6rem;margin:0 -16px;padding:.6rem 16px;
  background:rgba(246,247,251,.82);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.top h1{font-size:1.2rem;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.back{width:2.5rem;height:2.5rem;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.back svg{width:1.15rem;height:1.15rem}

/* ----- 브랜드 ----- */
.brand{display:flex;align-items:center;gap:.6rem;padding:.9rem 0 .2rem}
.brand img,.brand .logo{width:2.3rem;height:auto;flex:none}
.brand .bt{flex:1;min-width:0;line-height:1.15}
.brand .bt b{display:block;font-size:1.35rem;font-weight:900;letter-spacing:-.03em}
.brand .bt b em{font-style:normal;color:var(--ci-sky)}
.brand .bt span{font-size:.74rem;color:var(--sub);font-weight:700;letter-spacing:.02em}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}

/* ----- 첫 화면 히어로 ----- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:1rem 1rem .95rem;margin-top:.5rem;
  background:linear-gradient(135deg,#d9f3ff 0%,#e6edff 48%,#eef7d6 100%);box-shadow:var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
.hero::before{width:9rem;height:9rem;right:-2.5rem;top:-3rem;background:radial-gradient(circle at 30% 30%,#ffd9b0,#ffd9b000 70%)}
.hero::after{width:7rem;height:7rem;right:3.5rem;bottom:-3.5rem;background:radial-gradient(circle at 50% 50%,#c9e98a,#c9e98a00 70%)}
.hero::before,.hero::after{z-index:0}
.hero>*{position:relative;z-index:1}
.hero .hi{font-size:1.25rem;font-weight:900;letter-spacing:-.03em;margin:.25rem 0 .1rem}
.hero .meta{font-size:.86rem;color:#3d4766;font-weight:600}
.cta{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;margin-top:.9rem;padding:.85rem 1rem .85rem 1.2rem;border-radius:18px;background:var(--navy);color:#fff;font-weight:800;font-size:1.08rem;box-shadow:0 8px 20px rgba(21,28,51,.22)}
.cta .arr{width:2.1rem;height:2.1rem;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center}
.cta:active{transform:scale(.985)}

/* ----- 기능 타일 ----- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.7rem}
.tile{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:.6rem;min-height:3.9rem;padding:.6rem .7rem;border-radius:var(--r);text-align:left;background:var(--c,#fff);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ib{width:2.3rem;height:2.3rem;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ic,var(--ci-blue));box-shadow:0 2px 6px rgba(21,28,51,.06)}
.tile .ib svg{width:1.35rem;height:1.35rem}
.tile b{font-size:1.02rem;font-weight:800;letter-spacing:-.02em;display:block}
.tile small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.12em;color:rgba(21,28,51,.45);text-transform:uppercase;margin-top:.05rem}
.tile.wide{grid-column:1/-1}
.t-blue{--c:var(--p-blue);--ic:var(--ci-blue)} .t-sky{--c:var(--p-sky);--ic:#0094c6} .t-peach{--c:var(--p-peach);--ic:#e07a00}
.t-lime{--c:var(--p-lime);--ic:#5d8f12} .t-lilac{--c:var(--p-lilac);--ic:#6b4fd8} .t-rose{--c:var(--p-rose);--ic:#d23b62}

/* ----- 카드·공통 ----- */
.hello{padding:.7rem 0 .2rem}
.hello b{font-size:1.2rem;font-weight:800;display:block}
.hello span{color:var(--sub);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.95rem;margin:.6rem 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 .3rem;font-size:1.04rem;font-weight:800;letter-spacing:-.02em}
.muted{color:var(--sub);font-size:.86rem}
.notice-banner{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:.7rem .85rem;margin-top:.6rem;box-shadow:var(--shadow)}
.notice-banner .ib{width:2.1rem;height:2.1rem;border-radius:11px;background:var(--p-peach);color:#e07a00;display:flex;align-items:center;justify-content:center;flex:none}
.notice-banner .nb{flex:1;min-width:0}
.notice-banner small{display:block;color:var(--warn);font-weight:800;font-size:.74rem}
.notice-banner b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{display:flex;align-items:center;justify-content:center;gap:.45rem;width:100%;min-height:2.85rem;padding:.5rem 1rem;border-radius:16px;font-weight:800;background:var(--navy);color:#fff;font-size:1rem;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok-strong);color:#fff}
.btn.danger{background:#fff;color:var(--no);border:1.5px solid #ffc2d0}
.btn.small{min-height:2.3rem;font-size:.86rem;width:auto;padding:.3rem .85rem;border-radius:12px}
.row{display:flex;gap:.5rem}
.row>*{flex:1}

.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.55rem 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.38rem .9rem;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips.wrap{flex-wrap:wrap;overflow:visible}

.datebar{display:flex;align-items:center;gap:.4rem;background:#fff;border:1px solid var(--line);border-radius:18px;padding:.35rem;margin-top:.5rem;box-shadow:var(--shadow)}
.datebar button{width:2.5rem;height:2.5rem;border-radius:13px;background:var(--p-blue);color:var(--ci-blue);display:flex;align-items:center;justify-content:center}
.datebar button svg{width:1.1rem;height:1.1rem}
.datebar .d{flex:1;text-align:center;font-weight:900;font-size:1.06rem;line-height:1.2;letter-spacing:-.02em}
.datebar .d small{display:block;font-weight:700;color:var(--sub);font-size:.7rem;letter-spacing:.04em}

/* ----- 출석 명단 ----- */
.stu{display:flex;align-items:stretch;gap:6px;margin:6px 0}
.stu .tg{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:.42rem .55rem .42rem .5rem;transition:background .15s,border-color .15s}
.stu .tg .ck{width:1.9rem;height:1.9rem;border-radius:50%;border:2px dashed #cfd5e3;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.stu .tg .ck svg{width:1.05rem;height:1.05rem;opacity:0}
.stu .tg b{font-size:1.08rem;font-weight:800;flex:none;letter-spacing:-.02em}
.stu .tg small{flex:1;min-width:0;color:var(--sub);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .tg .st{flex:none;font-weight:800;font-size:.78rem;padding:.18rem .6rem;border-radius:999px;background:var(--no-soft);color:var(--no)}
.stu.p .tg{border-color:#c8e48e;background:var(--ok-soft)}
.stu.p .tg .ck{border:0;background:var(--ok-strong)}
.stu.p .tg .ck svg{opacity:1}
.stu.p .tg .st{background:#fff;color:var(--ok)}
.stu .memo{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:0 .65rem;font-size:.78rem;font-weight:800;color:var(--sub)}
.stu .memo.nt{color:#c26a12;border-color:#f1d3ad;background:#fff8ef}
.sinfo{display:block;color:var(--sub);font-size:.8rem;line-height:1.45;margin-top:.1rem;overflow-wrap:anywhere}
.sinfo.ex{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.nprev{display:flex;gap:.4rem;align-items:flex-start;width:100%;text-align:left;margin-top:.35rem;padding:.35rem .55rem;border-radius:10px;background:#fff8ef;border:1px solid #f6e2c8;font-size:.8rem;color:var(--ink)}
.nprev svg{flex:none;width:.95rem;height:.95rem;color:#c26a12;margin-top:.1rem}
.nprev span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nprev em{font-style:normal;color:var(--sub);font-weight:700;margin-right:.25rem}
.tbl .nbtn{border:0;background:none;padding:0 .15rem;color:#c26a12;vertical-align:-2px}.tbl .nbtn svg{width:.95rem;height:.95rem}
.tbl td.nt{max-width:16rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.nbig{font-size:1.02rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;background:#fffaf3;border:1px solid #f6e2c8;border-radius:14px;padding:.8rem .9rem;margin:.5rem 0}
.ncls{display:flex;align-items:baseline;gap:.5rem;margin:1.1rem 0 .2rem}.ncls h3{margin:0}
.nrow{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.55rem .75rem;margin:.4rem 0}
.nrow .nr-h{display:flex;gap:.4rem;align-items:baseline;flex-wrap:wrap}.nrow .nr-h b{font-size:1rem}
.nrow .nr-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.86rem;margin-top:.2rem;color:var(--ink)}
.nnone{font-size:.8rem;color:var(--sub);margin:.2rem 0 0}

.savebar{position:fixed;left:0;right:0;bottom:0;padding:.55rem 16px calc(.55rem + env(safe-area-inset-bottom));background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.savebar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:.8rem}
.savebar .sum{font-weight:800;font-size:.88rem;white-space:nowrap;line-height:1.3}
.savebar .btn{flex:1}
.g{color:var(--ok)} .r{color:var(--no)} .s{color:var(--sub)}

.list-item{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:.6rem .8rem;margin:.45rem 0;box-shadow:0 1px 2px rgba(21,28,51,.03)}
.list-item .grow{flex:1;min-width:0}
.list-item b{font-size:1.04rem;font-weight:800}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;background:var(--p-blue);color:var(--ci-blue);vertical-align:middle}
.badge.g{background:var(--ok-soft);color:var(--ok)} .badge.r{background:var(--no-soft);color:var(--no)} .badge.w{background:var(--warn-soft);color:var(--warn)}
.call{flex:none;display:flex;align-items:center;gap:.3rem;padding:.4rem .75rem;border-radius:999px;background:var(--p-lime);color:var(--ok);font-weight:800;font-size:.82rem;text-decoration:none}

/* ----- 통계 ----- */
.stat-big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:.6rem}
.stat-big div{border-radius:18px;padding:.75rem .4rem;text-align:center;background:var(--p-sky)}
.stat-big div:nth-child(2){background:var(--p-lime)} .stat-big div:nth-child(3){background:var(--p-lilac)}
.stat-big b{display:block;font-size:1.6rem;font-weight:900;line-height:1.1;letter-spacing:-.03em}
.stat-big span{font-size:.72rem;color:#3d4766;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:5px;height:8rem;margin-top:.6rem}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,#8fd6f7,#bfe6fa);border-radius:8px 8px 4px 4px;min-height:3px}
.bars .b:last-child i{background:linear-gradient(180deg,#9fd14a,#cfe89a)}
.bars .b em{font-style:normal;font-size:.6rem;color:var(--sub);margin-top:3px;white-space:nowrap}
.bars .b span{font-size:.68rem;font-weight:800;margin-bottom:2px}
.meter{height:.6rem;background:#eef0f6;border-radius:99px;overflow:hidden;margin-top:.35rem}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#7cc8f0,var(--ci-blue));border-radius:99px}

.weeks{display:flex;gap:.35rem;margin-top:.45rem}
.wk{flex:1;height:2.5rem;border-radius:12px;border:1.5px dashed #cfd5e3;background:#fff;font-weight:800;font-size:.82rem;color:var(--sub)}
.wk.on{background:var(--ok-strong);border:1.5px solid var(--ok-strong);color:#fff}

.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:.45rem}
.dots i{width:1rem;height:1rem;border-radius:5px;background:#e8ebf2}
.dots i.p{background:var(--ok-strong)} .dots i.a{background:#ffc2d0}

/* ----- 시트(팝업) ----- */
.sheet-bg{position:fixed;inset:0;background:rgba(21,28,51,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:.6rem 16px calc(1rem + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet::before{content:"";display:block;width:2.6rem;height:.3rem;border-radius:9px;background:#dfe3ec;margin:0 auto .7rem}
.sheet{position:relative}
.sheet-x{position:sticky;top:0;float:right;z-index:2;width:2.4rem;height:2.4rem;margin:-.2rem -.2rem 0 .4rem;border-radius:50%;background:var(--bg);border:1px solid var(--line);color:var(--sub);font-size:1rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.sheet h2{margin:0 0 .5rem;font-size:1.2rem;font-weight:900;letter-spacing:-.02em}

#toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.65rem 1.2rem;border-radius:999px;font-weight:800;z-index:40;display:none;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(21,28,51,.25)}
#loading{position:fixed;inset:0;background:rgba(246,247,251,.6);z-index:30;display:none;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:var(--sub)}
#loading.on{display:flex}
#loading::before{content:"";width:1.4rem;height:1.4rem;border-radius:50%;border:3px solid var(--p-blue);border-top-color:var(--ci-blue);margin-right:.6rem;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ----- 로그인 ----- */
.login-hero{text-align:center;padding:1.4rem 0 .4rem}
.login-hero img{width:4.2rem;height:auto}
.login-hero .name{font-size:2.6rem;font-weight:900;letter-spacing:-.05em;line-height:1;margin:.7rem 0 .3rem}
.login-hero .name em{font-style:normal;color:var(--ci-sky)}
.login-hero p{margin:.2rem 0;color:var(--sub);font-size:.9rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:.8rem}
.pad button{height:3.5rem;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:1.45rem;font-weight:800;box-shadow:var(--shadow)}
.pad button:active{background:var(--p-blue)}
.pad button.k-ok{background:var(--navy);color:#fff;font-size:1rem}
.pad button.k-del{font-size:.95rem;color:var(--sub)}

.qt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.22rem;padding:.5rem .15rem .45rem;border-radius:15px;background:var(--c,#fff);min-width:0}

/* ===== 홈 화면에 추가 · 앱 설명 ===== */
.intro{margin-top:.5rem;padding:.6rem .7rem;border-radius:16px;background:linear-gradient(135deg,var(--p-sky),var(--p-lilac));font-size:.88rem}

.intro .btn{width:100%}
.hint.warn{background:var(--warn-soft);color:#8a4a06}
.inst{display:flex;gap:6px;margin-top:.4rem}
.inst-go{flex:1;display:flex;align-items:center;gap:.5rem;padding:.38rem .6rem;border-radius:13px;background:var(--p-lime);text-align:left;min-width:0}
.inst-go .ib{width:1.6rem;height:1.6rem;border-radius:8px;background:#fff;color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.inst-go .ib svg{width:1rem;height:1rem}
.inst-go b{flex:1;min-width:0;font-size:.88rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inst-go small{flex:none;font-size:.72rem;color:var(--sub);font-weight:700}
.inst-x{width:2.3rem;flex:none;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--sub);font-weight:800}
.steps{list-style:none;padding:0;margin:.4rem 0}
.steps li{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px dashed var(--line)}
.steps li>i{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--ci-blue);color:#fff;font-style:normal;font-weight:900;display:flex;align-items:center;justify-content:center}
.steps li>div{line-height:1.6;font-size:.95rem}
.key{display:inline-flex;align-items:center;gap:.2rem;padding:0 .45rem;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 0 var(--line);font-weight:800;white-space:nowrap}
.key svg{width:1rem;height:1rem;color:var(--ci-blue)}
.ios-arrow{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:60;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--ci-orange);color:#fff;display:flex;align-items:center;justify-content:center;animation:bob 1s ease-in-out infinite;box-shadow:0 6px 16px rgba(247,148,29,.45)}
.ios-arrow svg{width:1.4rem;height:1.4rem}
@keyframes bob{50%{transform:translate(-50%,7px)}}
.keep{display:flex;align-items:center;gap:.45rem;justify-content:center;font-size:.84rem;color:var(--sub);margin-top:.7rem}
.keep input{width:1.15rem;height:1.15rem;padding:0;margin:0}
.ver{text-align:center;font-size:.66rem;color:var(--sub);margin-top:.2rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.ver .vb{font-size:.86rem;font-weight:900;letter-spacing:-.04em;color:var(--navy)}
.ver .vb em{font-style:normal;color:var(--ci-sky)}
.welcome .wb{flex:none;font-style:normal;font-size:1.05rem;font-weight:900;letter-spacing:-.045em;color:var(--navy);line-height:1.3;margin-top:.1rem}
.welcome .wb em{font-style:normal;color:var(--ci-sky)}
.chk{margin:.3rem 0 0;padding-left:1.1rem;font-size:.86rem;line-height:1.55}
/* ===== 회계 ===== */
.stat-big.fin b{font-size:1.15rem}
.fcard{display:block;width:100%;text-align:left}
.ftbl{width:100%;border-collapse:collapse;font-size:.84rem}
.ftbl th,.ftbl td{padding:.3rem .3rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ftbl th:first-child,.ftbl td:first-child{text-align:left}
.ftbl td.l{text-align:left;white-space:normal}
.ftbl thead th{color:var(--sub);font-size:.72rem;font-weight:800}
.ftbl tfoot th,.ftbl tfoot td{font-weight:900;border-top:2px solid var(--ink);border-bottom:0}
.meter{height:.6rem;border-radius:99px;background:var(--line);overflow:hidden;margin-top:.35rem}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ci-sky),var(--ci-blue))}
.meter.sm{height:.42rem;margin:.3rem 0 .2rem}
.meter.over i{background:linear-gradient(90deg,#f7941d,#e0456a)}
.fbars{display:flex;align-items:flex-end;gap:4px;height:6.5rem;margin-top:.4rem}
.fb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.fb .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:1px}
.fb .pair i{width:45%;border-radius:4px 4px 2px 2px;min-height:2px}
i.in{background:#7ccbf0} i.out{background:#ffb866}
.fb em{font-style:normal;font-size:.6rem;color:var(--sub);margin-top:2px}
.legend{display:flex;gap:.8rem;justify-content:flex-end;font-size:.72rem;color:var(--sub);margin-top:.3rem}
.legend i{display:inline-block;width:.6rem;height:.6rem;border-radius:3px;margin-right:.25rem;vertical-align:-1px}
.fin-it .fd{width:2.6rem;font-weight:900;font-size:.86rem;flex:none}
.fa{font-weight:900;white-space:nowrap;font-size:.95rem;flex:none}
.fa.in{color:var(--ok)} .fa.out{color:var(--ink)}
.badge.fg1{background:var(--p-lime);color:#4d6b0f} .badge.fg2{background:var(--p-peach);color:#a55a00}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:.2rem}
.seg2 button{padding:.55rem;border-radius:13px;background:var(--bg);border:1px solid var(--line);font-weight:900;font-size:1rem;color:var(--sub)}
.seg2 button.on.out{background:var(--warn-soft);border-color:#f7c08a;color:#a55a00}
.seg2 button.on.in{background:var(--ok-soft);border-color:#b9dd7d;color:var(--ok)}
.budget .pc{font-weight:900;font-size:.95rem;flex:none}
.frow{display:flex;gap:6px;margin-top:.35rem}
.frow select{flex:1;min-width:0}
.sumline{display:flex;flex-wrap:wrap;gap:.2rem .8rem;font-size:.86rem;margin:.4rem 0 0;align-items:center}
.report{background:#fff;border-radius:16px;padding:.8rem .8rem 1rem;margin-top:.45rem;border:1px solid var(--line)}
.report h2{font-size:1.12rem;margin:0}
.report h4{margin:.9rem 0 .25rem;font-size:.92rem}
@media print{
  .tools,.top,.noprint,#sync,.sig,.foot,#toast,#loading,.savebar,#modal{display:none!important}
  html,body,#app{background:#fff!important;padding:0!important;margin:0!important}
  .report{border:0;padding:0}
  .ftbl{font-size:9.5pt}
  .ftbl tr{break-inside:avoid}
  .tblwrap{overflow:visible!important}
}

/* ===== 교사 출석 ===== */
.myatt{display:flex;align-items:center;gap:6px;margin-top:.4rem;padding:.35rem .4rem .35rem .65rem;border-radius:13px;background:#fff;border:1px solid var(--line);flex-wrap:wrap}
.myatt .lbl{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.myatt .lbl b{font-size:.88rem;font-weight:900}
.myatt .lbl small{font-size:.7rem;color:var(--sub);font-weight:700}
.ma{display:inline-flex;align-items:center;gap:.25rem;padding:.42rem .75rem;border-radius:11px;background:var(--p-blue);color:var(--ci-blue);font-weight:800;font-size:.86rem}
.ma.on{background:var(--ok-soft);color:var(--ok)}
.ma svg{width:.95rem;height:.95rem}
.tbig{width:100%;min-height:2.9rem;font-size:1.02rem}
.trow{display:flex;align-items:center;gap:.5rem;font-size:.84rem;padding:.15rem 0}
.trow span{width:2.6rem;font-weight:800}
.trow .meter{flex:1;margin:0}
.trow b{width:2.6rem;text-align:right}

/* 권한 체크 */
.perms{display:grid;gap:6px}
.perm{display:flex!important;align-items:center;gap:.6rem;margin:0!important;padding:.45rem .6rem;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}
.perm.on{background:var(--p-blue);border-color:#b9cff7}
.perm input{width:1.35rem;height:1.35rem;padding:0;margin:0;flex:none}
.perm span{display:flex;flex-direction:column;line-height:1.3}
.perm b{font-size:.95rem;color:var(--ink)}
.perm small{font-size:.74rem;color:var(--sub);font-weight:600}

/* =====================================================================
   v2 디자인 시스템 — Modern Minimal Church Management
   (위의 규칙을 덮어씀: 흰 카드 + 얇은 회색 테두리 + 아주 옅은 그림자, 강조색 절제)
   ===================================================================== */
#app{padding:0 16px calc(max(84px,5.2rem) + 54px + env(safe-area-inset-bottom))}
.wide #app{padding:0 24px calc(max(84px,5.2rem) + 54px + env(safe-area-inset-bottom))}
svg.ic{stroke-width:1.85}
svg.ic [fill-opacity]{fill-opacity:0}           /* Lucide 계열: 면 없이 선만 */

/* 상단 바 */
.top{margin:0 -16px;padding:.45rem 16px;gap:.55rem;background:rgba(247,248,250,.88);border-bottom:1px solid transparent;transition:border-color .2s}
.wide .top{margin:0 -24px;padding:.45rem 24px}
.top h1{font-size:1.1rem;font-weight:800;letter-spacing:-.025em}
.back{width:2.6rem;height:2.6rem;border-radius:var(--r-btn);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.back:active{background:var(--bg)}
body.scrolled .top{border-bottom-color:var(--line)}
/* 아이폰: 맨 위 상태 표시줄 자리는 단색으로 덮고, 화면은 그 아래부터 (흐림 없이 또렷하게) */
.top{top:env(safe-area-inset-top);background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
body{padding-top:env(safe-area-inset-top)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:16;pointer-events:none}
/* 아이폰만: 시계 줄 아래 흐림 띠를 피해서 한 칸 더 내려 시작 */
@supports (-webkit-touch-callout:none){
  :root{--topgap:14px}
  body{padding-top:calc(env(safe-area-inset-top) + var(--topgap))}
  body::before{height:calc(env(safe-area-inset-top) + var(--topgap))}
  .top{top:calc(env(safe-area-inset-top) + var(--topgap))}
}

/* 카드 · 목록 */
.card{overflow-x:auto;-webkit-overflow-scrolling:touch}   /* 큰 글씨에서 표가 넓어지면 카드 안에서만 옆으로 밀림 */
.card{border-radius:var(--r);padding:.85rem .9rem;margin:.55rem 0;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h3{font-size:1rem;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.list-item{border-radius:16px;padding:.55rem .75rem;margin:.4rem 0;min-height:3.1rem;border:1px solid var(--line);box-shadow:none;transition:background .15s,transform .1s}
.list-item:active{background:var(--bg);transform:scale(.99)}
.av,.list-item:nth-child(n) .av{background:var(--p-blue);color:var(--pri);font-weight:800}
.muted{color:var(--sub)}

/* 버튼 */
.btn{min-height:2.75rem;border-radius:var(--r-btn);font-weight:700;background:var(--navy);transition:transform .1s,opacity .15s,background .15s}
.btn:active{transform:scale(.98);opacity:.92}
.btn.light{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.light:active{background:var(--bg)}
.btn.ok{background:var(--ok)}
.btn.danger{border:1px solid #f3c9d0;color:var(--no)}
.btn.small{min-height:2.3rem;border-radius:12px;font-size:.84rem}
.chips{gap:.35rem;padding:.45rem 0}
.chip{padding:.4rem .85rem;border:1px solid var(--line);font-weight:700;font-size:.86rem;color:var(--ink);min-height:2.3rem}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{font-weight:700;background:var(--p-blue);color:var(--pri)}
.call{background:var(--ok-soft);color:var(--ok)}
input,textarea,select{border:1px solid var(--line);border-radius:12px;padding:.55rem .75rem;min-height:2.75rem;background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--navy)}
label{font-weight:700;color:var(--sub)}

/* 기능 타일(관리 화면 등): 흰 카드 + 아이콘 둘레만 옅은 색 */
.t-blue{--c:var(--p-blue);--ic:var(--pri)} .t-sky{--c:var(--p-sky);--ic:#2a87b3} .t-peach{--c:var(--p-peach);--ic:#c0801f}
.t-lime{--c:var(--p-lime);--ic:var(--ok)} .t-lilac{--c:var(--p-lilac);--ic:#5a5fb5} .t-rose{--c:var(--p-rose);--ic:#c24a62}
.tile{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);min-height:4rem}
.tile .ib{background:var(--c);color:var(--ic);box-shadow:none}
.tile small{color:var(--sub)}
.mini{box-shadow:none}
.pick button,.pick button:nth-child(n){background:#fff;box-shadow:none;border:1px solid var(--line)}
.pick button span{color:var(--sub)}

/* 날짜 바 · 통계 */
.datebar{border-radius:18px;box-shadow:none}
.datebar button{background:var(--bg);color:var(--navy);border-radius:12px;width:2.6rem;height:2.6rem}
.stat-big div,.stat-big div:nth-child(n){background:#fff;border:1px solid var(--line);border-radius:18px}
.stat-big b{color:var(--navy)}
.stat-big span{color:var(--sub)}
.bars .b i{background:#c9dcf2} .bars .b:last-child i{background:var(--pri)}
.meter{background:#edf0f4}
.meter i{background:linear-gradient(90deg,var(--pri),var(--navy))}
.meter.over i{background:linear-gradient(90deg,var(--warn-c),var(--no))}
i.in{background:#8cb9e6} i.out{background:#f0c27e}
.dots i.p{background:var(--ok)}
.wk.on{background:var(--ok);border-color:var(--ok)}

/* 출석 명단 */
.stu .tg{border:1px solid var(--line);border-radius:14px;min-height:2.9rem}
.stu .tg .ck{border:1.5px dashed #cdd3dc}
.stu.p .tg{border-color:#bfe0cc;background:var(--ok-soft)}
.stu.p .tg .ck{background:var(--ok)}
.stu .memo{border:1px solid var(--line);border-radius:14px}
.savebar{background:rgba(255,255,255,.92)}

/* 안내 · 경고 */
.hint{background:var(--p-blue);color:#24548a;border-radius:14px;font-weight:600}
.hint.warn,.past{background:var(--warn-soft);color:var(--warn)}
.intro{background:#fff;border:1px solid var(--line);border-radius:18px}

/* 팝업 */
.sheet-bg{background:rgba(20,43,80,.32)}
.sheet{border-radius:24px 24px 0 0;padding:.55rem 16px calc(1rem + env(safe-area-inset-bottom))}
.sheet-x{width:2.6rem;height:2.6rem}

/* 로딩 · 빈 화면 · 오류: 한 모양으로 */
.empty{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:2rem 1rem;color:var(--sub);font-size:.9rem;font-weight:600}
.empty.load::before{content:"";width:1.5rem;height:1.5rem;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--pri);animation:spin .8s linear infinite}
#loading{background:rgba(247,248,250,.65)}
#loading::before{border-color:var(--line);border-top-color:var(--pri)}
#toast{bottom:calc(84px + env(safe-area-inset-bottom));border-radius:14px;font-weight:700;background:var(--navy)}
#sync{top:calc(8px + env(safe-area-inset-top))}

/* 로그인 */
.pad button{border:1px solid var(--line);box-shadow:none;border-radius:16px;font-weight:700}
.pad button:active{background:var(--p-blue)}
.yearsel button{border:1px solid var(--line);box-shadow:none}
.yearsel button.on{background:var(--navy);border-color:var(--navy)}
.yearchip{border:1px solid var(--line);box-shadow:none;min-height:2.5rem;padding:.3rem .8rem;font-size:.92rem;font-weight:800}
.org-lead{background:var(--p-blue)}
.node.officer{background:var(--p-lilac);border-color:#e3e4f3}
.perm.on{background:var(--p-blue);border-color:#c5d8f0}

/* ===================== 홈 대시보드 ===================== */
.hd{display:flex;align-items:center;gap:.5rem;padding:.75rem 0 .15rem}
.hd .logo{flex:1;min-width:0;display:flex;align-items:center}
.hd .logo img{height:2.35rem;width:auto;max-width:100%}
.icon-btn{position:relative;width:2.75rem;height:2.75rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.icon-btn:active{background:#eef1f5}
.icon-btn svg{width:1.4rem;height:1.4rem}
.icon-btn .dot{position:absolute;top:.55rem;right:.6rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--no);box-shadow:0 0 0 2px var(--bg)}
.welcome{margin:.65rem 0 0;display:flex;align-items:flex-start;gap:.6rem}
.welcome>div{flex:1;min-width:0}
.welcome b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.welcome span{display:block;font-size:.88rem;color:var(--sub);margin-top:.1rem}

.main-att{position:relative;overflow:hidden;display:flex;align-items:center;gap:.8rem;width:100%;margin-top:.85rem;padding:1.05rem 1rem 1.05rem 1.15rem;border-radius:22px;text-align:left;color:#fff;
  background:linear-gradient(125deg,#142b50 0%,#1a3a6e 55%,#2468b4 100%);box-shadow:0 8px 22px rgba(20,43,80,.18);transition:transform .12s}
.main-att::after{content:"";position:absolute;right:-3.5rem;top:-4rem;width:12rem;height:12rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,0) 70%);pointer-events:none}
.main-att:active{transform:scale(.985)}
.main-att .tx{flex:1;min-width:0;position:relative;z-index:1}
.main-att small{display:flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:600;color:rgba(255,255,255,.82)}
.main-att small svg{width:1.05rem;height:1.05rem}
.main-att b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.035em;margin:.25rem 0 .1rem;line-height:1.2}
.main-att p{margin:0;font-size:.84rem;color:rgba(255,255,255,.72)}
.main-att .go{position:relative;z-index:1;width:3.1rem;height:3.1rem;flex:none;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.main-att .go svg{width:1.4rem;height:1.4rem}

.info2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:10px;margin-top:10px}
.icard{display:flex;flex-direction:column;gap:.45rem;min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:.8rem .8rem .75rem;text-align:left;box-shadow:var(--shadow)}
button.icard{transition:transform .1s,background .15s}
button.icard:active{transform:scale(.985);background:#fbfcfd}
.icard .ih{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem;min-height:1.6rem}
.icard .ih b{font-size:.92rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.icard .ih svg{width:1.15rem;height:1.15rem;color:var(--pri)}
.icard .ih .more{margin-left:auto;display:flex;align-items:center;font-size:.72rem;font-weight:600;color:var(--sub);white-space:nowrap;min-height:2rem;padding-left:.3rem}
.icard .ih .more svg{width:.85rem;height:.85rem;color:var(--sub)}
.icard .ih small{margin-left:auto;font-size:.74rem;color:var(--sub);font-weight:600}
.icard .nt{font-size:.92rem;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.icard .ns{margin-top:auto;padding-top:.45rem;border-top:1px solid var(--line);font-size:.76rem;color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .ns.imp{color:var(--warn)}
.mrow{display:flex;align-items:center;gap:.55rem;width:100%;min-height:2.75rem;padding:.2rem 0;text-align:left;border-radius:12px}
.mrow:active{background:var(--bg)}
.mrow .ring{width:2.25rem;height:2.25rem;flex:none;border-radius:50%;border:1.5px dashed #c6cdd8;display:flex;align-items:center;justify-content:center;color:var(--pri);transition:all .15s}

@media (min-width:700px){
  .wkc{display:grid;grid-template-columns:1.2fr 2fr}
  .wk-bl{padding:.9rem 1rem}
  .wk-bl b{font-size:1.25rem}
  .wk-sub{border-top:0;border-left:1px solid var(--line)}
  .fsbig .wkc{grid-template-columns:1fr}
  .fsbig .wk-sub{grid-template-columns:1fr 1fr;border-left:0;border-top:1px solid var(--line)}
  .fsbig .wk-sub>*+*{border-top:0!important;border-left:1px solid var(--line)!important}
}
/* 줄여 보기 (이름만) */
.vmode{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.vmode button{padding:.3rem .75rem;font-size:.8rem;font-weight:700;color:var(--sub);background:none;border:0}
.vmode button.on{background:var(--pri);color:#fff}
.vbar{display:flex;align-items:center;gap:.4rem;margin:.55rem 0 .1rem}.vbar>span{font-size:.8rem;color:var(--sub);font-weight:700}
.nmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:6px;margin-top:.5rem}
.nmgrid button{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:.5rem .6rem;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.nmgrid b{font-size:.95rem;max-width:100%;overflow-wrap:anywhere}.nmgrid small{font-size:.72rem;color:var(--sub);font-weight:600}
.nmgrid button.off{opacity:.55}
.nmh{margin:.8rem .1rem 0;font-size:.8rem;font-weight:800;color:var(--sub)}
/* 주소록: 전화 · 문자 작은 아이콘 오른쪽 */
.dact{display:flex;gap:.35rem;flex:none;margin-left:auto}
.dact a{width:2.05rem;height:2.05rem;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--pri)}
.dact a.tel{background:var(--ok);border-color:var(--ok);color:#fff}
.dact svg{width:1.05rem;height:1.05rem}
.dlist{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 .75rem;margin-top:.6rem}
.drow{display:flex;align-items:center;gap:.5rem;min-height:2.9rem;border-bottom:1px solid #eef1f5}.drow:last-child{border-bottom:0}
.drow>span:first-child{flex:1;min-width:0}.drow b{font-size:.98rem}.drow small{color:var(--sub);font-weight:600;font-size:.8rem;margin-left:.3rem}
/* 기도 · 봉헌: 이번 주 담당 칸 고정 */
.psticky{position:sticky;z-index:4;top:var(--toph,3rem);background:var(--bg);padding-bottom:.35rem}
.psticky .hero{margin-top:.5rem}
</style>

var ABOUT_DEF = "# 이름의 뜻\n> HERE. 지금 여기 함께하시는 주님 앞에, \"저 여기 있어요\" 하고 대답하는 우리.\n- 여기요!: 출석을 부를 때 \"여기요!\" 하고 대답하는 그 한마디에서 이름을 지었어요.\n- 임마누엘: 지금 여기, 우리와 함께하시는 예수님. (마 1:23)\n- 하나님 나라: 먼 훗날이 아니라 지금 여기 임하는 하나님 나라. (눅 17:21)\n- 내가 여기 있나이다: 부르심에 응답했던 아브라함, 사무엘, 이사야처럼 출석 한 번이 주님께 드리는 작은 응답이 되기를. (창 22:1 · 삼상 3:10 · 사 6:8)\n- 네가 어디 있느냐: 하나님이 먼저 찾으셨듯, 오지 않은 친구를 먼저 찾아가는 마음. 언젠가 그 친구가 \"저 여기 있어요\" 하고 대답하기를. (창 3:9)\n- 두세 사람이 모인 곳에: 우리가 함께 모인 바로 여기에 주님이 계십니다. (마 18:20)\n- 네 자리는 여기 있어: 고등부는 언제든 돌아올 수 있는 자리. 새 친구는 반갑게 맞고, 쉬고 있는 친구의 자리는 비워 두고 기다려요.\n\n# 왜 만들었나요\n> 사역이 '일'이 아니라 '감사'가 되도록.\n- AI로 줄인 일: 출석 · 명단 · 공지 · 기록처럼 반복되는 일을 AI를 활용해 가볍게 했어요.\n- 대신할 수 없는 것에 집중: AI가 대신할 수 없는 영성과 관계, 한 영혼을 만나는 일에 마음을 쏟기 위해.\n- 양육에 집중: 교역자가 행정보다 말씀과 양육에 집중할 수 있도록 돕기 위해.\n- 이견 없는 행정: 하나의 자료를 함께 보며, 불필요한 행정과 그로 인한 오해 · 이견을 줄이기 위해.\n- 감사가 되는 사역: 맡은 일이 짐이 아니라, 함께 섬기는 기쁨과 감사가 되기 위해.";

function aboutHtml(text) {

  };

    line = line.trim(); if (!line) return;

function yearSunday(past) { var y = viewYear(), ty = todayStr().slice(0, 4); return y === ty ? (past ? lastSunday() : attSunday()) : y > ty ? firstSundayOf(y) : lastSundayOf(y); }

/* 부르는 이름: 교역자는 직분으로 (이한빈 목사님), 그 밖의 선생님은 친근하게 '쌤' */
function personOf(name) {
  var pools = [(S.boot && S.boot.teachers) || []], li = LOGIN.lists || {}, c = store('hs_li') || {};
  Object.keys(li).forEach(function (y) { pools.push(li[y] || []); });
  Object.keys(c.lists || {}).forEach(function (y) { pools.push(c.lists[y] || []); });
  for (var i = 0; i < pools.length; i++) for (var j = 0; j < pools[i].length; j++) if (pools[i][j].이름 === name) return pools[i][j];
  return null;
}
function honor(name) {
  var t = personOf(name) || {}, j = String(t.직분 || ''), r = String(t.역할 || '');
  var m = (j + ' ' + r).match(/(담임목사|부목사|목사|강도사|전도사)/);

  return '쌤';
}
function callName(name) { return name + ' ' + honor(name); }
function isAdmin() { return S.role === 'admin'; }
/** 일반 선생님 쓰기: 보기 전용 · 손님(다른 해 선생님) · 지난 해 자료는 안 됨 */
function canWrite() { return isAdmin() ? !S.viewOnly : !S.viewOnly && !(S.boot && S.boot.guest) && !isPastYear(); }
function students() { return S.boot.students; }
function stuById(id) { return students().filter(function (s) { return s.ID === id; })[0]; }
function classNames() { return S.boot.classes.map(function (c) { return c.반; }).filter(function (c) { return /^\d-\d$/.test(c); }); }
/** 담임 반 (담임이 아니면 '') */
function homeClass() {
  var t = S.boot.teachers.filter(function (t) { return t.이름 === S.user; })[0];
  if (t && /^\d-\d$/.test(t.담당반 || '')) return t.담당반;
  var c = S.boot.classes.filter(function (c) { return /^\d-\d$/.test(c.반) && (c.담임교사 || '').split(/[,\s]+/).indexOf(S.user) >= 0; })[0];
  return c ? c.반 : '';
}
function myClass() { return homeClass() || classNames()[0]; }

/* ========================= 빠르게 열기 (캐시) =========================
   한 번 본 화면은 지난 데이터로 바로 보여주고, 뒤에서 조용히 새 데이터를 받아 바뀐 게 있으면 다시 그립니다. */
var CACHE = {}, ATT = {};
function loadSpec(view, p) {
  switch (view) {
    case 'stats': return { key: 'stats', action: 'getStats', payload: {} };
    case 'newcomers': return { key: 'newcomers', action: 'getNewcomers', payload: {} };
    case 'notes': return { key: 'notes', action: 'getNotes', payload: { limit: 120 } };
    case 'notices': return { key: 'notices', action: 'getNotices', payload: {} };
    case 'ministry': return { key: 'ministry', action: 'getMinistry', payload: {} };
    case 'student': return p && p.id ? { key: 'student:' + p.id, action: 'getStudent', payload: { id: p.id } } : null;
    case 'directory': return { key: 'directory', action: 'getDirectory', payload: {} };
    case 'org': return { key: 'org', action: 'getTab', payload: { tab: '조직' } };
    case 'prayer': return { key: 'prayer', action: 'getTab', payload: { tab: '기도봉헌' } };
    case 'worship': return { key: 'worship', action: 'getTab', payload: { tabs: ['찬양팀', '찬양인도', '찬양콘티'] } };
    case 'bulletin': return { key: 'bulletin', action: 'getTab', payload: { tabs: BL_TABS } };
    case 'officers': return { key: 'officers', action: 'getTab', payload: { tabs: ['임역원', '임역원회의'] } };
    case 'tatt': return { key: 'tatt', action: 'getTab', payload: { tabs: ['교사모임', '교사출석'] } };
    case 'requests': case 'reqApp': case 'reqIdea': case 'reqPlan': return { key: 'requests', action: 'getRequests', payload: {} };
    case 'finance': return { key: 'finance', action: 'getTab', payload: { tabs: ['회계', '예산'] } };
    case 'report': return { key: 'report:' + rpDate(p), action: 'getReport', payload: { date: rpDate(p) } };
    case 'admTeachers': return isAdmin() ? { key: 'admTeachers', action: 'getTeachers', payload: {} } : null;
  }
  return null;
}
function refreshQuiet(view, spec) {
  if (OUT.q.length) return;   // 아직 보내지 않은 저장이 있으면 지금 화면(내가 바꾼 것)을 그대로 둠
  call(spec.action, spec.payload, true).then(function (d) {
    if (OUT.q.length) return;
    var changed = JSON.stringify(d) !== JSON.stringify(CACHE[spec.key]);
    CACHE[spec.key] = d; if (changed) saveSnapSoon();
    if (changed && S.view === view && !$('modal').innerHTML) { if (view === 'bulletin') blKeep(); S.params._data = d; render(); }   // 주보 입력 중이면 쓰던 칸을 지킴
  }).catch(function () {});
}
/** 로그인 직후: 이번 주 출석과 모든 메뉴 데이터를 한 번에 미리 받기 (다 받으면 메뉴가 바로 열림) */
function warmUp() {
  if (S._warm) return; S._warm = true; S._warmBusy = true;
  var sun = yearSunday();
  call('prefetch', { date: sun }, 'silent').then(function (d) {
    S._warmBusy = false;
    var fresh = { stats: d.stats, newcomers: d.newcomers, notes: d.notes, notices: d.notices, ministry: d.ministry };
    if (d.tatt) fresh.tatt = d.tatt;
    for (var k in (d.more || {})) fresh[k] = d.more[k];
    var spec = loadSpec(S.view, S.params), cur = spec && spec.key, changed = false;
    for (var k2 in fresh) {
      if (k2 === cur && OUT.q.length) continue;   // 아직 보내는 중인 저장이 있으면 지금 화면 그대로
      if (k2 === cur && JSON.stringify(fresh[k2]) !== JSON.stringify(CACHE[k2])) changed = true;
      CACHE[k2] = fresh[k2];
    }
    if (!ATT[sun]) ATT[sun] = d.attendance;
    saveSnap();
    if ($('modal').innerHTML || S.dirty) { var w = $('warmbar'); if (w) w.remove(); return; }
    if (S.view === 'home') render();
    else if (changed) { S.params._data = CACHE[cur]; render(); }
  }).catch(function () { S._warm = false; S._warmBusy = false; var w = $('warmbar'); if (w) w.remove(); });
}

/* ---------- 이 기기에 마지막 화면 자료 보관 (로그인 유지 기기만) → 다음에 열 때 기다리지 않고 바로 시작 ---------- */
var SNAP_KEY = 'hs_snap', SNAP_DAYS = 21;
function saveSnap() {
  if (!S.boot || !S.user || !store('hs_login') || isPastYear()) return;   // 로그인 유지를 끈 기기 · 지난 해 자료는 보관하지 않음
  var c = {}; for (var k in CACHE) if (k.indexOf('student:') !== 0) c[k] = CACHE[k];
  var v = { n: S.user, y: S.boot.year, t: Date.now(), boot: S.boot, role: S.role, isSuper: S.isSuper, fin: S.fin, cache: c };
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(v)); }
  catch (e) { try { v.cache = {}; localStorage.setItem(SNAP_KEY, JSON.stringify(v)); } catch (e2) { unstore(SNAP_KEY); } }   // 자리가 모자라면 첫 화면 자료만
}
function loadSnap(name) {
  var v = store(SNAP_KEY);
  if (!v || v.n !== name || !v.boot || Date.now() - (v.t || 0) > SNAP_DAYS * 864e5) return null;
  return v;
}
var _snapT;
function saveSnapSoon() { clearTimeout(_snapT); _snapT = setTimeout(saveSnap, 1500); }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveSnap(); });

/* ========================= 저장 대기열 (한 번에 모아서 보내기) =========================
   누르면 화면은 바로 바뀌고, 저장은 이 기기에 쌓였다가 약 1초 뒤 한 번에 구글시트로 갑니다.
   인터넷이 끊기면 보관했다가 다시 연결되면 보냅니다. (앱을 닫아도 다음에 열 때 보냄) */
var OUT = { q: [], busy: false, timer: null, err: 0, okUntil: 0 };
function outKey() { return S.auth ? 'hs_out_' + S.auth.name + '_' + S.auth.year : ''; }
function saveOut() { if (outKey()) store(outKey(), OUT.q); }

function newId(prefix) { return prefix + 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

  OUT.q.push({ opId: newId('op'), action: action, p: p });
  saveOut(); syncBadge(); scheduleFlush(900);
}
function scheduleFlush(ms) { clearTimeout(OUT.timer); OUT.timer = setTimeout(flushOut, ms); }
function flushOut() {
  if (OUT.busy && Date.now() - OUT.busy < 30000) return;   // 보내는 중 (30초 넘게 답이 없으면 다시 시도)
  if (!OUT.q.length || !S.auth) return;
  OUT.busy = Date.now(); syncBadge();
  var batch = OUT.q.slice(0, 40);
  call('batch', { ops: batch }, 'silent').then(function (res) {
    OUT.busy = false; OUT.err = 0;
    var done = {}, bad = [];
    batch.forEach(function (o, i) { done[o.opId] = 1; if (res[i] && !res[i].ok) bad.push(res[i].error); });
    OUT.q = OUT.q.filter(function (o) { return !done[o.opId]; });
    saveOut(); delete CACHE.stats;
    if (bad.length) toast('저장하지 못한 것이 있어요: ' + bad[0]);
    OUT.okUntil = Date.now() + 1800; syncBadge();
    if (OUT.q.length) scheduleFlush(300); else setTimeout(syncBadge, 1900);
  }).catch(function (e) {
    OUT.busy = false;
    if (e && e.ok === false && !e.auth) { OUT.q = OUT.q.filter(function (o) { return batch.indexOf(o) < 0; }); saveOut(); toast('저장하지 못했어요: ' + (e.error || '')); syncBadge(); return; }
    OUT.err++; syncBadge(); scheduleFlush(Math.min(30000, 2500 * OUT.err));
  });
}
function syncBadge() {
  var el = $('sync'); if (!el) return;
  var n = OUT.q.length;
  if (!S.user) { el.className = ''; return; }
  if (n) { el.className = 'on ' + (OUT.err ? 'wait' : 'busy'); el.innerHTML = '<i></i>' + (OUT.err ? '연결 기다리는 중 ' : '저장 중 ') + n; }
  else if (Date.now() < OUT.okUntil) { el.className = 'on ok'; el.innerHTML = ic('tick') + '저장됨'; }
  else el.className = '';
}
/** 서버 결과가 꼭 필요한 일(학생 명단 올리기 등) 전에: 쌓인 저장부터 보냄 */
function needSynced() {
  if (!OUT.q.length) return true;
  flushOut(); toast('먼저 저장하는 중이에요. 잠시 후 다시 눌러 주세요'); return false;
}
function upsertLocal(list, obj, key) {
  key = key || 'ID';
  var f = list.filter(function (x) { return x[key] === obj[key]; })[0];
  if (f) { for (var k in obj) if (obj[k] !== undefined) f[k] = obj[k]; return f; }
  list.push(obj); return obj;
}
function removeLocal(list, id) { var i = list.findIndex(function (x) { return x.ID === id; }); if (i >= 0) list.splice(i, 1); }
window.addEventListener('online', function () { OUT.err = 0; scheduleFlush(200); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') scheduleFlush(300); });

/* ========================= 화면 전환 ========================= */
function go(view, params, noPush) {
  if (S.dirty && S.view === 'attend' && view !== 'attend') {
    if (!confirm('저장하지 않은 출석이 있어요.\n저장하지 않고 나갈까요?')) return;
    S.dirty = false;
  }
  if (!noPush && S.view !== view) S.history.push({ view: S.view, params: S.params });
  S.view = view; S.params = params || {};
  var spec = loadSpec(view, S.params), quick = false;
  if (spec && !S.params._data && CACHE[spec.key]) { S.params._data = CACHE[spec.key]; quick = true; }
  closeModal();
  render();
  window.scrollTo(0, 0);
  if (quick) refreshQuiet(view, spec);
}
function back() { var h = S.history.pop() || { view: 'home', params: {} }; go(h.view, h.params, true); }
function topbar(title, extra) {
  return '<div class="top"><button class="back" onclick="back()" aria-label="뒤로">' + ic('back') + '</button><h1>' + esc(title) + '</h1>' + (extra || '') + fsSeg() + '</div>';
}
/** 모든 화면 맨 위: 글씨 크기(가로로 넓은 버튼) + PC 넓게 보기 */
function toolStrip() {
  return '<div class="tools"><span class="fs-lb">글씨 크기</span>' + fsSeg() +
    '<button class="pcbtn" onclick="togglePC()">' + (isWide() ? '휴대폰 화면' : 'PC 넓게 보기') + '</button></div>';
}
function isWide() { var v = store('hs_pc'); return (v === null || v === undefined) ? window.innerWidth >= 900 : !!v; }
function applyWide() { document.body.classList.toggle('wide', isWide()); }
function togglePC() { store('hs_pc', !isWide()); applyWide(); render(); }
function render() {
  var app = $('app');
  if (!S.user || !S.boot) { app.innerHTML = toolStrip() + viewLogin(); return; }
  var v = VIEWS[S.view] || VIEWS.home;
  var out = v(S.params);
  if (typeof out === 'string') app.innerHTML = out + (out.indexOf('class="savebar"') < 0 ? bnav() : '');
  var spec = loadSpec(S.view, S.params);

/** 아래에서 올라오는 창: 맨 위 오른쪽 ✕, 저장 버튼이 있는 창에는 맨 아래 [저장하지 않고 닫기]도 */
function modal(html) {
  var hasSave = /onclick="[^"]*save/i.test(html);
  $('modal').innerHTML = '<div class="sheet-bg" onclick="if(event.target===this)closeModal()"><div class="sheet">' +
    '<button class="sheet-x" onclick="closeModal()" aria-label="닫기">✕</button>' + html +
    (hasSave ? '<button class="btn light" style="margin-top:.5rem" onclick="closeModal()">저장하지 않고 닫기</button>' : '') + '</div></div>';
}
function closeModal() { $('modal').innerHTML = ''; }

var VIEWS = {};   // 화면들 (관리자 화면이 먼저 등록되므로 여기서 선언)

/* ========================= 로그인: 연도 → 이름 → 전화번호 뒷자리 ========================= */
var LOGIN = { step: 'name', year: '', years: null, defaultYear: '', lists: {}, name: '', code: '', busy: false };
function loadLoginInfo(year) {
  // 이 기기에 기억해 둔 이름 목록을 먼저 보여주고, 서버에서 새로 받아 바꿈
  var cached = store('hs_li');
  if (cached && !LOGIN.years) { LOGIN.years = cached.years; LOGIN.defaultYear = cached.defaultYear; LOGIN.lists = cached.lists || {}; LOGIN.year = LOGIN.year || cached.defaultYear; }
  LOGIN._loading = true;
  call('loginInfo', { year: year || '' }, 'silent').then(function (d) {
    LOGIN._loading = false;
    LOGIN.years = d.years; LOGIN.defaultYear = d.defaultYear;
    if (!LOGIN.year || LOGIN.year === d.year || !year) LOGIN.year = d.year;
    LOGIN.lists[d.year] = d.teachers;
    store('hs_li', { years: d.years, defaultYear: d.defaultYear, lists: LOGIN.lists });
    if (!S.user) render();
  }).catch(function () { LOGIN._loading = false; if (!S.user) render(); });
}
function viewLogin() {
  if (!LOGIN.years && !LOGIN._loading) loadLoginInfo('');
  var head = '<div class="login-hero">' + wordmark(true) + '</div>';

  var list = LOGIN.lists[LOGIN.year];
  if (!list && !LOGIN._loading) loadLoginInfo(LOGIN.year);

  if (LOGIN.step === 'code') {
    var dots = '';
    for (var i = 0; i < 4; i++) dots += '<i class="' + (LOGIN.code.length > i ? 'on' : '') + '"></i>';
    var keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, '처음', 0, '지우기'].map(function (k) {
      return '<button class="' + (k === '지우기' || k === '처음' ? 'k-del' : '') + '" onclick="codeKey(\'' + k + '\')">' + k + '</button>';
    }).join('');
    return head + '<div class="who"><span class="av">' + esc(LOGIN.name.charAt(0)) + '</span><div><b>' + esc(callName(LOGIN.name)) + '</b><span>' + esc(LOGIN.year) + '년</span></div></div>' +
      '<p style="text-align:center;margin:.9rem 0 0">내 <b>전화번호 뒷자리 4자리</b>를 눌러 주세요</p>' +
      '<div class="pin-dots">' + dots + '</div><div class="pad">' + keys + '</div>' +
      '<label class="keep"><input type="checkbox" ' + (LOGIN.keep !== false ? 'checked' : '') + ' onchange="LOGIN.keep=this.checked">이 기기에 로그인 유지 (30일)</label>' +
      '<p class="muted" style="text-align:center;margin:.2rem 0 0">다른 사람 휴대폰 · 교회 PC라면 체크를 끄고 들어오세요.</p>' +
      '<div class="hint" style="margin-top:.8rem">구글시트와 연결되어 있어서 <b>처음 들어올 때는 조금 기다려야 해요</b> (10초쯤). 한 번 들어오면 모든 메뉴 자료를 미리 받아 두고, 로그인을 유지한 기기는 다음부터 바로 열려요.</div>' + verLine('margin-top:1.2rem') + sigFooter();
  }

  var years = '<div class="yearsel">' + LOGIN.years.map(function (y) {
    var tag = y === LOGIN.defaultYear ? '기본' : y < LOGIN.defaultYear ? '지난 자료' : '준비 중';
    return '<button class="' + (y === LOGIN.year ? 'on' : '') + '" onclick="pickYear(\'' + y + '\')"><b>' + y + '</b><small>' + tag + '</small></button>';
  }).join('') + '</div>';
  var rows = !list ? '<div class="empty load">불러오는 중…</div>' : list.map(function (t) {
    var sub = t.담당반 ? t.담당반 + '반 담임' : (t.역할 || '');
    return '<button class="list-item" ' + (t.ok ? 'onclick="pickTeacher(\'' + esc(t.이름) + '\')"' : 'onclick="toast(\'연락처가 등록되어 있지 않아요. 담당 선생님께 문의해 주세요\')" style="opacity:.55"') + '>' +
      '<span class="av">' + esc((t.이름 || '?').charAt(0)) + '</span><span class="grow"><b>' + esc(t.이름) + '</b> <span class="muted">' + esc(t.직분 || '') + '</span>' +
      '<br><span class="muted">' + esc(t.ok ? sub : '연락처 없음') + '</span></span></button>';
  }).join('');
  return head + appIntro() + (LOGIN.years.length > 1 ? years : '') +
    '<h3 style="margin:1rem 0 .2rem">어느 선생님이세요?</h3><p class="muted" style="margin:0">반가워요! 내 이름을 눌러 주세요</p>' + rows + verLine('margin-top:1.2rem') + sigFooter();
}
function pickYear(y) { LOGIN.year = y; LOGIN.step = 'name'; render(); if (!LOGIN.lists[y]) loadLoginInfo(y); else loadLoginInfo(y); }
function pickTeacher(n) { LOGIN.name = n; LOGIN.code = ''; LOGIN.step = 'code'; render(); }
function codeKey(k) {
  if (LOGIN.busy) return;
  if (k === '처음') { LOGIN.step = 'name'; LOGIN.code = ''; render(); return; }
  if (k === '지우기') LOGIN.code = LOGIN.code.slice(0, -1);
  else if (LOGIN.code.length < 4) LOGIN.code += k;
  render();
  if (LOGIN.code.length === 4) tryLogin();
}
function tryLogin() {
  S.auth = { year: LOGIN.year, name: LOGIN.name, code: LOGIN.code };
  LOGIN.busy = true;
  var bootP = call('boot', { dev: devName() });
  $('loading').innerHTML = '<span>구글시트에서 자료를 불러오는 중이에요<small>처음 들어올 때는 10초쯤 걸릴 수 있어요</small></span>';

function chStu(id, k, v) {

var NOTE_REQ = false;
function notesBy() {
  if (!CACHE.notes) {
    if (!NOTE_REQ) { NOTE_REQ = true; call('getNotes', { limit: 120 }, 'silent').then(function (d) { CACHE.notes = d; render(); }).catch(function () { NOTE_REQ = false; }); }

  return m;
}
function oneLine(t) { return String(t || '').replace(/\s+/g, ' ').trim(); }

  return [s.학교, bd, s.보호자 ? '보호자 ' + s.보호자 : ''].filter(Boolean).join(' · ');

  var n = (nb[s.ID] || [])[0]; if (!n) return '';
  return '<button class="nprev" onclick="event.stopPropagation();noteModal(\'' + s.ID + '\')">' + ic('chat') + '<span><em>' + shortD(n.날짜) + ' ' + esc(n.유형 || '') + '</em>' + esc(oneLine(n.내용)) + '</span></button>';

function noteModal(id) {

  var m = (d['교사모임'] || []).filter(function (x) { return x.ID === mid; })[0] || {};
  var on = !tIsIn(d, date, mid, name);

  else d['교사출석'] = d['교사출석'].filter(function (r) { return !(r.날짜 === date && r.모임ID === mid && r.이름 === name); });
  enqueue('saveTeacherAtt', { date: date, meetId: mid, meet: m.이름 || '', name: name, on: on });
  render();
  if (name === S.user) toast(on ? (m.이름 || '일정') + ' 출석했어요. 함께해 주셔서 고마워요' : '출석을 취소했어요');

/** 선생님이 직접 체크할 수 있는 가장 오래된 날 (오늘부터 2개월 전) */
function tLimit() { var d = parseD(todayStr()); d.setMonth(d.getMonth() - 2); return ymd(d); }
/** 지난 2개월 동안 내가 체크하지 않은 모임 [날짜, 모임] (최근 것부터) */

/** 홈: 한 줄로 바로 체크 */
function myAttLine() {

VIEWS.tatt = function (p) {

function tCheck(d, p) {
  var date = p.date || tDefaultDate(d), ms = meetsOn(d, date), names = S.boot.teachers.filter(function (x) { return !x.보기; }).map(function (x) { return x.이름; });

    '<button onclick="S.params.date=tStep(S.params._data,\'' + date + '\',1);render()" aria-label="다음 일정">' + ic('next') + '</button></div>';

    var on = tIsIn(d, date, m.ID, S.user);

    var all = isAdmin() ? '<div class="chips wrap" style="padding:.4rem 0 0">' + names.map(function (n) {
      return '<button class="chip ' + (here.indexOf(n) >= 0 ? 'on' : '') + '" onclick="tToggle(\'' + date + '\',\'' + m.ID + '\',\'' + esc(n) + '\')">' + esc(n) + '</button>';
    }).join('') + '</div><p class="muted" style="margin:.3rem 0 0">이름을 누르면 그 선생님 출석이 바뀌어요</p>'

    return '<div class="card"><div style="display:flex;align-items:center;gap:.5rem"><h3 style="flex:1;margin:0">' + esc(m.이름) + (m.시간 ? ' <span class="muted" style="font-size:.85rem;font-weight:600">' + esc(m.시간) + '</span>' : '') + '</h3><span class="badge g">' + here.length + ' / ' + names.length + '명</span></div>' +
      (date > todayStr() ? '<div class="hint warm" style="margin-top:.5rem">' + (date === attSunday() ? '이번 주일 출석 대기 중이에요. 그날 체크해 주세요.' : '아직 다가올 일정이에요. 그날 함께해요!') + '</div>' : '<button class="btn ' + (on ? 'ok' : 'light') + ' tbig" style="margin-top:.5rem" onclick="tToggle(\'' + date + '\',\'' + m.ID + '\',S.user)">' + (on ? ic('tick') + ' 출석했어요 (누르면 취소)' : '나 출석 체크하기') + '</button>') + all + '</div>';
  }).join('');
  // 지난 모임 중 체크 안 한 것: 한 번 눌러 체크 (2개월 전까지)

    miss.map(function (x) { return '<button class="ma" onclick="tToggle(\'' + x[0] + '\',\'' + x[1].ID + '\',S.user)">' + shortD(x[0]) + ' ' + esc(x[1].이름) + '</button>'; }).join('') +

    .filter(function (x) { return x[0] && x[0] <= addDays(t0, 60); }).sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : byOrder(a[1], b[1]); }).slice(0, 5);
  var upHtml = up.length ? '<div class="card"><h3>다가오는 일정</h3>' + up.map(function (x) {

  }).join('') + '</div>' : '';

function tStats(d, p) {
  var ms = (d['교사모임'] || []).slice().sort(byOrder), mid = p.mid || (ms[0] && ms[0].ID) || '';
  var rows = (d['교사출석'] || []).filter(function (r) { return r.모임ID === mid && r.날짜 <= todayStr(); });
  var held = rows.map(function (r) { return r.날짜; }).filter(function (x, i, a) { return a.indexOf(x) === i; }).sort();
  var names = S.boot.teachers.filter(function (x) { return !tNoStat(x); }).map(function (x) { return x.이름; });
  rows = rows.filter(function (r) { return names.indexOf(r.이름) >= 0; });

  var per = names.map(function (n) { var c = rows.filter(function (r) { return r.이름 === n; }).length; return [n, c, held.length ? Math.round(c / held.length * 100) : 0]; })
    .sort(function (a, b) { return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); });
  if (!isAdmin()) per = per.filter(function (x) { return x[0] === S.user; });   // 일반 선생님은 내 기록만
  var chips = ms.map(function (m) { return '<button class="chip ' + (m.ID === mid ? 'on' : '') + '" onclick="S.params.mid=\'' + m.ID + '\';render()">' + esc(m.이름) + '</button>'; }).join('');

    '<div class="split"><div><div class="card"><h3>' + (isAdmin() ? '선생님별 출석' : '내 출석') + '</h3>' + (held.length ? '<table class="ftbl"><thead><tr><th>이름</th><th>출석</th><th>출석률</th></tr></thead><tbody>' + per.map(function (x) {
      return '<tr' + (x[0] === S.user ? ' style="background:var(--p-sky)"' : '') + '><td class="l">' + esc(x[0]) + '</td><td>' + x[1] + ' / ' + held.length + '</td><td><b>' + x[2] + '%</b></td></tr>';
    }).join('') + '</tbody></table>' : '<p class="muted">아직 기록이 없어요</p>') + '</div></div>' +
    '<div><div class="card"><h3>최근 인원</h3>' + (recent || '<p class="muted">아직 기록이 없어요</p>') + '</div></div></div>' +
    '<p class="muted">모인 날 = 한 명이라도 출석 체크한 날</p>';

function tManage(d) {

/* ---------- 글씨 크기 ---------- */
var SIZES = [15, 17, 20], DEF_FS = 17, SIZE_NAMES = ['작게', '보통', '크게'];
/** 예전 9단계로 저장된 크기는 가장 가까운 단계로 */
function curFs() { var v = +(store('hs_fs') || DEF_FS), b = SIZES[0]; SIZES.forEach(function (x) { if (Math.abs(x - v) < Math.abs(b - v)) b = x; }); return b; }
function fontStep(d) {

  var j = Math.max(0, Math.min(SIZES.length - 1, i + d));
  if (j === i) { toast(d > 0 ? '가장 큰 글씨예요' : '가장 작은 글씨예요'); return; }

  }

if (IS_GAS) start();
else {
  // GitHub Pages: config.js 에 APP_API(앱 주소)가 있으면 실제 데이터,
  // 없으면 컴퓨터 미리보기용 예시 데이터(preview-mock.js)
